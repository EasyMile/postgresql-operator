# This rule is not used by the project postgresql-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over postgresql.easymile.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: postgresql-operator
    app.kubernetes.io/managed-by: kustomize
  name: postgresqlbackupprovider-admin-role
rules:
- apiGroups:
  - postgresql.easymile.com
  resources:
  - postgresqlbackupproviders
  verbs:
  - '*'
- apiGroups:
  - postgresql.easymile.com
  resources:
  - postgresqlbackupproviders/status
  verbs:
  - get
